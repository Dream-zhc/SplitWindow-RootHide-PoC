name: Build RootHide DEB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos
      THEOS_PACKAGE_SCHEME: roothide
      ARCHS: arm64 arm64e
      TARGET: iphone:clang:16.5:16.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: brew install dpkg ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --filter=blob:none https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1
          git -C "$THEOS" rev-parse HEAD

      - name: Install patched iOS 16.5 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"
          echo "Using patched SDK: $THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            ARCHS="arm64 arm64e" \
            TARGET="iphone:clang:16.5:16.0"
          ls -lah packages/

      - name: Verify package before publishing
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"

          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          echo "Package: $DEB"
          echo "Version: $VERSION"
          echo "Architecture: $ARCH"
          if [ "$ARCH" != "iphoneos-arm64e" ]; then
            echo "Unexpected RootHide package architecture: $ARCH (expected iphoneos-arm64e)" >&2
            exit 1
          fi

          rm -rf verify-root
          mkdir verify-root
          dpkg-deb -x "$DEB" verify-root

          DYLIB="$(find verify-root -type f -name 'SplitWindow.dylib' -print -quit)"
          PLIST="$(find verify-root -type f -name 'SplitWindow.plist' -path '*DynamicLibraries*' -print -quit)"
          PREFS="$(find verify-root -type d -name 'SplitWindowPrefs.bundle' -print -quit)"
          FEATURE="$(find verify-root -type f -name 'SplitWindowFeature.dylib' -print -quit)"
          PREF_ENTRY="$(find verify-root -type f -name 'SplitWindow.plist' -path '*PreferenceLoader/Preferences*' -print -quit)"
          PREF_ICON="$(find verify-root -type f -name 'SplitWindow.png' -path '*PreferenceLoader/Preferences*' -print -quit)"
          test -n "$DYLIB"
          test -n "$PLIST"
          test -n "$PREFS"
          test -n "$FEATURE"

          PREFS_INFO="$PREFS/Info.plist"
          PREFS_ROOT="$PREFS/Root.plist"
          PREFS_BIN="$PREFS/SplitWindowPrefs"
          test -f "$PREFS_INFO"
          test -f "$PREFS_ROOT"
          test -f "$PREFS_BIN"
          test "$(plutil -extract CFBundleExecutable raw -o - "$PREFS_INFO")" = "SplitWindowPrefs"
          test "$(plutil -extract NSPrincipalClass raw -o - "$PREFS_INFO")" = "SWRootListController"
          strings "$PREFS_BIN" | grep -q 'SWRootListController'
          test -n "$PREF_ENTRY"
          test -n "$PREF_ICON"

          echo "--- Loader Mach-O ---"
          file "$DYLIB"
          SLICES="$(lipo -archs "$DYLIB")"
          echo "$SLICES"
          echo "$SLICES" | grep -qw arm64
          echo "$SLICES" | grep -qw arm64e
          if echo "$SLICES" | grep -Eq 'armv7|armv7s'; then
            echo "Unexpected 32-bit slice: $SLICES" >&2
            exit 1
          fi
          echo "--- Loader linked libraries ---"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -Eq '/Foundation\\.framework/|/UIKit\\.framework/|/QuartzCore\\.framework/|/FrontBoard|libobjc'; then
            echo "Unsafe loader dependency detected" >&2
            exit 1
          fi
          if strings "$DYLIB" | grep -Eq 'SWOverlayController|FBSceneManager|_UISceneLayerHostContainerView|launchApplicationWithIdentifier'; then
            echo "Feature/FrontBoard code leaked into the SpringBoard loader" >&2
            exit 1
          fi
          strings "$DYLIB" | grep -q 'BOOT loader alive after 8s'
          echo "--- Feature Mach-O ---"
          file "$FEATURE"
          FEATURE_SLICES="$(lipo -archs "$FEATURE")"
          echo "$FEATURE_SLICES"
          echo "$FEATURE_SLICES" | grep -qw arm64
          echo "$FEATURE_SLICES" | grep -qw arm64e
          strings "$FEATURE" | grep -q 'START-4 explicit activation windows visible'
          echo "--- Preferences bundle ---"
          PREFS_BIN="$PREFS/SplitWindowPrefs"
          test -f "$PREFS_BIN"
          otool -L "$PREFS_BIN"
          if ! otool -L "$PREFS_BIN" | grep -q '/PrivateFrameworks/Preferences.framework/Preferences'; then
            echo "Preferences bundle is missing required Preferences.framework dependency" >&2
            exit 1
          fi
          strings "$PREFS_BIN" | grep -q 'com.dream.splitwindow/activationRequested'
          strings "$PREFS_BIN" | grep -q 'SWRootListController'
          strings "$PREFS_BIN" | grep -q 'SWAppListController'
          strings "$PREFS_BIN" | grep -q 'showAppPicker'
          strings "$PREFS_BIN" | grep -q '_applicationIconImageForBundleIdentifier:format:scale:'
          strings "$FEATURE" | grep -q 'SBApplicationController'
          strings "$FEATURE" | grep -q 'mainScene'
          strings "$FEATURE" | grep -q 'initWithScene:debugDescription:'
          strings "$FEATURE" | grep -q 'RBSProcessHandle'
          strings "$FEATURE" | grep -q 'FBSMutableSceneDefinition'
          strings "$FEATURE" | grep -q 'createSceneWithDefinition:initialParameters:'
          strings "$FEATURE" | grep -q 'SCENE-CREATE success'
          strings "$FEATURE" | grep -q 'SCENE-SYSTEM found'
          strings "$FEATURE" | grep -q 'HOST warm-suspend'
          strings "$FEATURE" | grep -q 'DismissRequiresDoubleTap'
          plutil -p "$PREF_ENTRY" | grep -q 'SplitWindow.png'
          echo "--- Filter plist ---"
          plutil -p "$PLIST"

          {
            echo "version=$VERSION"
            echo "architecture=$ARCH"
            echo "dylib=$DYLIB"
            echo "slices=$SLICES"
            echo "feature=$FEATURE"
            echo "feature_slices=$FEATURE_SLICES"
            echo "preferences=$PREFS_BIN"
            echo "preference_icon=$PREF_ICON"
            echo "theos=$(git -C "$THEOS" rev-parse HEAD)"
            echo "scheme=roothide"
            echo "target=$TARGET"
          } > packages/BUILD-VERIFICATION.txt

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SplitWindow-v0.5.2-RootHide
          path: |
            packages/*.deb
            packages/BUILD-VERIFICATION.txt
          if-no-files-found: error
